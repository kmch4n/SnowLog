# Instrument I1 (#86 §10.1): run the SnowLogMediaCore XCTest target on an EAS macOS
# worker, in an iOS Simulator, with no signing credentials.
#
#   npx eas-cli build --platform ios --profile ios-test --non-interactive --wait
#
# A failing test fails the "Run XCTest" step and therefore the build. The .xcresult
# bundle is uploaded as the build artifact either way.
build:
  name: SnowLogMediaCore XCTest (I1)
  steps:
    - eas/checkout
    - eas/install_node_modules
    - eas/prebuild
    - run:
        name: Declare SnowLogMediaCore with its test spec
        working_directory: ./ios
        # Expo autolinking only passes test specs with includeTests, which would turn
        # them on for every Expo pod. A pod declared before use_expo_modules! is left
        # as declared (expo-modules-autolinking autolinking_manager.rb), so declare
        # just this one, with testspecs, ahead of it.
        command: |
          ruby -i -pe '$_ = %(  pod "SnowLogMediaCore", path: "../modules/snowlog-media/ios", testspecs: ["Tests"]\n) + $_ if $_ =~ /^\s*use_expo_modules!/' Podfile
          grep -n 'testspecs: \["Tests"\]' Podfile
    - run:
        name: Install pods
        working_directory: ./ios
        command: pod install
    - eas/start_ios_simulator
    - run:
        name: Run XCTest
        working_directory: ./ios
        command: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEMES=$(xcodebuild -list -workspace "$WORKSPACE")
          echo "$SCHEMES" | grep -i snowlogmedia || true
          if echo "$SCHEMES" | grep -q 'SnowLogMediaCore-Unit-Tests'; then
            SCHEME=SnowLogMediaCore-Unit-Tests
          else
            SCHEME=SnowLogMediaCore
          fi
          UDID=$(xcrun simctl list devices booted | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          echo "workspace=$WORKSPACE scheme=$SCHEME simulator=$UDID"
          xcrun simctl list devices booted
          mkdir -p build
          xcodebuild test \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath build/I1.xcresult \
            CODE_SIGNING_ALLOWED=NO
    - run:
        name: Zip the result bundle
        if: ${ always() }
        working_directory: ./ios
        command: ditto -c -k --keepParent build/I1.xcresult build/I1.xcresult.zip
    - eas/upload_artifact:
        name: Upload the result bundle
        if: ${ always() }
        inputs:
          type: build-artifact
          path: ios/build/I1.xcresult.zip
