# A deleted default technique stays deleted after the app restarts, and a new
# technique is added at the end of the list.
appId: com.kmch4n.snowlog
name: Technique defaults stay deleted
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-import-button"
    timeout: 60000
- tapOn: "設定"
# The row reads "滑走種別, 動画の滑走種別を管理します, 詳細を表示".
- tapOn: "滑走種別,.*"
- extendedWaitUntil:
    visible:
      id: "technique-delete-ハーフパイプ"
    timeout: 20000
- tapOn:
    id: "technique-delete-ハーフパイプ"
- takeScreenshot: 40_technique_delete_confirm
# The confirmation alert's destructive button. Every row also has a 「削除」
# button and neither rightOf nor childOf picks the alert's, so tap it by position
# (the right-hand button of the centred alert; the device is fixed by the workflow).
- assertVisible: "削除の確認"
- tapOn:
    point: "68%,58%"
- extendedWaitUntil:
    notVisible:
      id: "technique-delete-ハーフパイプ"
    timeout: 10000
- tapOn:
    id: "technique-add-input"
- inputText: "Test run"
# Submit from the keyboard: with the keyboard up, the add row sits behind it
# on iOS 26 and 「追加」 cannot be tapped (#99).
- pressKey: Enter
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Test run"
    direction: DOWN
- assertVisible:
    text: "Test run"
    below: "その他"
- takeScreenshot: 41_technique_added

- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-import-button"
    timeout: 60000
- tapOn: "設定"
- tapOn: "滑走種別,.*"
- extendedWaitUntil:
    visible:
      id: "technique-delete-大回り"
    timeout: 20000
- scrollUntilVisible:
    element: "Test run"
    direction: DOWN
- assertNotVisible:
    id: "technique-delete-ハーフパイプ"
- takeScreenshot: 42_technique_after_restart
