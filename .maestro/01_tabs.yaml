# Opens every tab on a fresh install and screenshots it.
# Run by .github/workflows/ios-simulator.yml, which passes SCREENS (an absolute
# directory) and switches the simulator to Japanese first.
appId: com.kmch4n.snowlog
name: Tabs render on a fresh install
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "home-import-button"
    timeout: 90000
- takeScreenshot: ${SCREENS}/01_home
- tapOn: "ダッシュボード"
- waitForAnimationToEnd
- takeScreenshot: ${SCREENS}/02_dashboard
- tapOn: "カレンダー"
- waitForAnimationToEnd
- takeScreenshot: ${SCREENS}/03_calendar
- tapOn:
    text: "検索"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: ${SCREENS}/04_search
- tapOn: "設定"
- waitForAnimationToEnd
- takeScreenshot: ${SCREENS}/05_settings
