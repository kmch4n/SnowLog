# The resort field on the video detail screen: an exact master name typed without
# tapping a suggestion is saved when the field loses focus, and clearing the text
# removes the resort. Runs after 03_detail_and_search.yaml; 02 already set
# 白馬八方尾根スキー場 from the GPS suggestion, so a different resort is typed here.
appId: com.kmch4n.snowlog
name: Resort input commits on blur
---
- launchApp
- tapOn: "ホーム"
- extendedWaitUntil:
    visible:
      id: "video-card"
    timeout: 60000
- tapOn:
    id: "video-card"
- extendedWaitUntil:
    visible:
      id: "resort-search-input"
    timeout: 20000
- tapOn:
    id: "resort-search-input"
- eraseText: 40
- inputText: "エイブル白馬五竜"
- takeScreenshot: 30_resort_typed
# Leave the field without picking a suggestion.
- tapOn:
    id: "detail-title-input"
- waitForAnimationToEnd
- runFlow: subflows/back.yaml
- tapOn:
    id: "video-card"
- extendedWaitUntil:
    visible:
      id: "resort-search-input"
    timeout: 20000
- assertVisible: "エイブル白馬五竜"
- takeScreenshot: 31_resort_saved

# Clearing the field removes the resort.
- tapOn:
    id: "resort-search-input"
- eraseText: 40
- tapOn:
    id: "detail-title-input"
- waitForAnimationToEnd
- runFlow: subflows/back.yaml
- tapOn:
    id: "video-card"
- extendedWaitUntil:
    visible:
      id: "resort-search-input"
    timeout: 20000
- assertNotVisible: "エイブル白馬五竜"
- takeScreenshot: 32_resort_cleared
- runFlow: subflows/back.yaml
