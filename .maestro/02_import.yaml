# Single import through the system photo picker (PHPicker), then the result on Home,
# the dashboard and the calendar. The test videos are .maestro/media/*.mov; the
# Hakuba one carries a location, so the import screen must suggest nearby resorts.
appId: com.kmch4n.snowlog
name: Single import
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-import-button"
    timeout: 60000
- tapOn:
    id: "home-import-button"
- extendedWaitUntil:
    visible:
      id: "import-pick-video"
    timeout: 20000
- takeScreenshot: 10_import_screen
- tapOn:
    id: "import-pick-video"
- extendedWaitUntil:
    visible: "ビデオ, 三秒, .*"
    timeout: 20000
- takeScreenshot: 11_picker
- tapOn: "ビデオ, 三秒, .*"
# The clip's location (written by scripts/make_maestro_media.sh) gives nearby
# resort suggestions (#98); photos_assets.txt in the artifact shows what Photos stored.
- extendedWaitUntil:
    visible: ".*撮影地の近くのスキー場.*"
    timeout: 30000
# The preview must be the movie's first frame, not an empty grey box (#97). It
# sits inside the pick button, so Maestro cannot see it: check 12_selected.png.
- waitForAnimationToEnd
- takeScreenshot: 12_selected
- tapOn:
    text: ".*白馬.*"
- scrollUntilVisible:
    element:
      id: "import-save"
    direction: DOWN
- takeScreenshot: 13_form_bottom
- tapOn:
    id: "import-save"
- extendedWaitUntil:
    visible:
      id: "home-import-button"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 14_home_with_video
- tapOn: "ダッシュボード"
- waitForAnimationToEnd
- takeScreenshot: 15_dashboard_with_video
- tapOn: "カレンダー"
- waitForAnimationToEnd
- takeScreenshot: 16_calendar_with_video
