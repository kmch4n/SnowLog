# Single import through the system photo picker (PHPicker), then the result on Home,
# the dashboard and the calendar. The test videos are .maestro/media/*.mov; the
# Hakuba one carries GPS, so the import screen should suggest a nearby resort.
appId: com.kmch4n.snowlog
name: Single import
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-import-button"
    timeout: 60000
- tapOn:
    id: "home-import-button"
- extendedWaitUntil:
    visible:
      id: "import-pick-video"
    timeout: 20000
- takeScreenshot: 10_import_screen
- tapOn:
    id: "import-pick-video"
- extendedWaitUntil:
    visible: "ビデオ, 三秒, .*"
    timeout: 20000
- takeScreenshot: 11_picker
- tapOn: "ビデオ, 三秒, .*"
- extendedWaitUntil:
    visible:
      id: "import-save"
    timeout: 30000
# The GPS suggestion depends on Photos keeping the clip's location
# (photos_assets.txt in the artifact shows what it recorded).
- extendedWaitUntil:
    visible: ".*撮影地の近くのスキー場.*"
    timeout: 15000
    optional: true
- takeScreenshot: 12_selected
- tapOn:
    text: ".*白馬.*"
    optional: true
- scrollUntilVisible:
    element:
      id: "import-save"
    direction: DOWN
- takeScreenshot: 13_form_bottom
- tapOn:
    id: "import-save"
- extendedWaitUntil:
    visible:
      id: "home-import-button"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 14_home_with_video
- tapOn: "ダッシュボード"
- waitForAnimationToEnd
- takeScreenshot: 15_dashboard_with_video
- tapOn: "カレンダー"
- waitForAnimationToEnd
- takeScreenshot: 16_calendar_with_video
