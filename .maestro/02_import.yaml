# Single import up to the system photo picker (PHPicker). The flow stops with the
# picker open; the workflow then saves its element hierarchy, which tells the next
# version of this flow how to select a video in it.
appId: com.kmch4n.snowlog
name: Single import up to the picker
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-import-button"
    timeout: 60000
- tapOn:
    id: "home-import-button"
- extendedWaitUntil:
    visible:
      id: "import-pick-video"
    timeout: 20000
- takeScreenshot: ${SCREENS}/10_import_screen
- tapOn:
    id: "import-pick-video"
- waitForAnimationToEnd
- takeScreenshot: ${SCREENS}/11_picker
