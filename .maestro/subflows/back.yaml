# Leaves a pushed screen. The native back button is labelled 「戻る」 (the tabs
# screen's title); if it is not found, swipe from the left edge instead.
appId: com.kmch4n.snowlog
---
- tapOn:
    text: "戻る"
    optional: true
- runFlow:
    when:
      visible:
        id: "detail-title-input"
    commands:
      - swipe:
          start: "1%, 50%"
          end: "90%, 50%"
- waitForAnimationToEnd
